name: Publish Package

# Unico workflow de publicacion. No duplicar este job en otro workflow:
# GitHub Packages rechaza republicar una version de artefacto ya existente
# (respuesta 4xx en "mvn deploy"), asi que dos workflows publicando la misma
# coordenada groupId:artifactId:version en el mismo evento "release" siempre
# terminan con al menos un fallo. Antes de crear un release, recuerda subir
# <version> en pom.xml a un valor que no se haya publicado todavia.
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Publish to GitHub Packages
        run: mvn -B deploy -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
