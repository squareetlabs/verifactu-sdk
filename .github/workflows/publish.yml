name: Publish Package

# Unico workflow de publicacion. No duplicar este job en otro workflow.
#
# Publica en Maven Central (Central Publisher Portal, central.sonatype.com)
# a traves del perfil "release" del pom.xml, que firma los artefactos con GPG
# y los sube con central-publishing-maven-plugin. Maven Central rechaza
# republicar una version de artefacto ya existente, asi que antes de crear un
# release recuerda subir <version> en pom.xml a un valor que no se haya
# publicado todavia.
#
# Secretos requeridos en el repositorio (Settings > Secrets and variables > Actions):
#   - CENTRAL_USERNAME  -> usuario del token generado en central.sonatype.com
#   - CENTRAL_PASSWORD  -> password del token generado en central.sonatype.com
#   - GPG_PRIVATE_KEY   -> clave privada GPG (bloque ASCII-armored completo)
#   - GPG_PASSPHRASE    -> passphrase de la clave GPG anterior
#
# El pom.xml esta configurado con autoPublish=false: tras este workflow hay
# que entrar en https://central.sonatype.com/publishing/deployments y pulsar
# "Publish" una vez la validacion termine en OK.

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          settings-path: ${{ github.workspace }}
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      # Se usa el Maven Wrapper (Maven 3.9.16 fijado en .mvn/wrapper) y no el
      # Maven del runner: con Maven 3.10.0 (runner ubuntu-24.04 >= 20261004)
      # central-publishing-maven-plugin 0.11.0 deja maven-metadata-local.xml en
      # el bundle y Central lo rechaza con "Bundle has content that does NOT
      # have a .pom file: com/squareetlabs/verifactu".
      - name: Publish to Maven Central
        run: ./mvnw -B -P release deploy -s $GITHUB_WORKSPACE/settings.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
